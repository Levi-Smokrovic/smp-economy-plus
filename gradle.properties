org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G
org.gradle.parallel=true
org.gradle.configuration-cache=true
# Several Loom projects in parallel need a lot of memory. Lower to 1 on OOM.
org.gradle.workers.max=2

mod.id=smpeconomy
mod.version=1.0.0
mod.archives=smp-economy-plus
# Links in fabric.mod.json (contact)
mod.homepage=https://modrinth.com/mod/smp-economy-plus
mod.sources=https://github.com/Levi-Smokrovic/smp-economy-plus

# Every version compiles against the same loader. The minimum in fabric.mod.json is set per version in versions/<mc>/.
deps.fabric_loader=0.19.5
# Read by loom-back-compat, one Loom version for both variants
loomx.loom_version=1.18.4

# Version-specific dependencies are in versions/<mc>/gradle.properties
